name: CI (Terraform)

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_call:

env:
  TF_IN_AUTOMATION: "1"
  TF_VAR_github_token: ${{ secrets.GH_TOKEN }} # repositories will be planned under the user associated with this PAT

jobs:

  init-validate-plan:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:

      - uses: actions/checkout@v7.0.1

      - name: Test Terraform PR comment
        run: node --test .github/scripts/terraform-pr-comment.test.cjs

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          cli_config_credentials_token: ${{ secrets.HCP_TF_TOKEN }}

      - name: Run 'terraform fmt'
        id: fmt
        run: terraform fmt -check -recursive
      
      - name: Run 'terraform init'
        id: init
        run: |
          terraform init -input=false -lockfile=readonly
       
      - name: Run 'terraform validate'
        id: validate
        run: terraform validate -no-color

      - name: Test personal repository policy
        run: |
          cp .terraform.lock.hcl modules/repository/.terraform.lock.hcl
          terraform -chdir=modules/repository init -backend=false -input=false -lockfile=readonly
          terraform -chdir=modules/repository test -no-color

      - name: Run 'terraform plan'
        id: planStep
        run: |
          terraform plan -input=false -no-color
      
      - name: Update Terraform PR comment
        uses: actions/github-script@v9.0.0
        if: github.event_name == 'pull_request' && always()
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.planStep.outcome }}
          PLAN_OUTPUT: ${{ steps.planStep.outputs.stdout }}
          PLAN_ERROR: ${{ steps.planStep.outputs.stderr }}
        with:
          # Existing integration credential authenticates as ant-devbot.
          github-token: ${{ secrets.INTEGRATION_TOKEN }}
          script: |
            const updateComment = require('./.github/scripts/terraform-pr-comment.cjs');
            await updateComment({ github, context });
